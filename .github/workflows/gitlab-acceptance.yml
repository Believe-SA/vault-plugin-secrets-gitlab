name: GitLab acceptance

# Live acceptance tests against a disposable GitLab CE instance. Booting GitLab
# takes several minutes, so this only runs as a gate before a release (called
# from release.yml) or on demand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitlab:
    name: Live GitLab CE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start and bootstrap GitLab CE
        run: scripts/gitlab-ce.sh up >> "$GITHUB_ENV"
      - name: Acceptance tests
        run: go test ./plugin/ -run TestAcc -v -count=1
      - name: GitLab logs
        if: failure()
        run: docker logs --tail 300 vault-plugin-gitlab-ce
      - name: Stop GitLab CE
        if: always()
        run: scripts/gitlab-ce.sh down
