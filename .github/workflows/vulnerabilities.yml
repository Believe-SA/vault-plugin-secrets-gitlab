name: Vulnerabilities

# govulncheck reports known vulnerabilities (Go vulnerability database) that
# are actually reachable from the plugin's code; the weekly run catches new
# advisories against unchanged code. Dependency review blocks pull requests
# that introduce vulnerable or newly-vulnerable dependencies.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
