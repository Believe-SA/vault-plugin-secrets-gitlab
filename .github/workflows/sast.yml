name: SAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    # The official Semgrep image, pinned by digest (the previously used
    # returntocorp/semgrep-action is archived and unmaintained).
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: semgrep scan --config p/default --error --metrics=off
