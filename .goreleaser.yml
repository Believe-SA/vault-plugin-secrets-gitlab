# GoReleaser configuration. Produces the bare plugin binary for the common
# Vault server / developer architectures plus a checksums.txt whose SHA-256 is
# exactly what `vault plugin register -sha256=...` expects.
# Docs: https://goreleaser.com
version: 2

project_name: vault-plugin-secrets-gitlab

before:
  hooks:
    - go mod download

builds:
  - id: plugin
    main: .
    binary: vault-plugin-secrets-gitlab
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Reported to Vault as the plugin RunningVersion: must match the
      # `-version` used at registration time.
      - -X github.com/splunk/vault-plugin-secrets-gitlab/plugin.Version=v{{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64

# Ship the raw binaries (no tarball) so operators can hash and register them
# directly. One asset per OS/arch.
archives:
  - id: binaries
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Believe-SA
    name: vault-plugin-secrets-gitlab
  prerelease: auto
  draft: false
  header: |
    Pre-built `vault-plugin-secrets-gitlab` plugin binaries, tested against
    Vault 1.21 and 2.x.

    Download the asset matching your Vault server's OS/arch, verify it against
    `checksums.txt`, then register the SHA-256 with Vault's plugin catalog.

    📦 **[Install instructions](https://github.com/Believe-SA/vault-plugin-secrets-gitlab#install-pre-built-binary)**
